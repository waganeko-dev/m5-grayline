name: Release

# Push a tag vX.Y.Z to build the firmware, create a GitHub Release with the
# images and the CHANGELOG section, and deploy the manual (with the Web
# Flasher firmware) to GitHub Pages.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Test, build and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags for git describe
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO and esptool
        run: pip install platformio esptool
      - name: Unit tests (native)
        run: pio test -e native
      - name: Build firmware
        run: pio run
      - name: Package images (release files and Web Flasher)
        run: python tools/package_firmware.py --version "$GITHUB_REF_NAME" --out out --web docs/public
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > out/release-notes.md
          if ! grep -q '[^[:space:]]' out/release-notes.md; then
            echo "::error::No section for [$version] in CHANGELOG.md"
            exit 1
          fi
          cat out/release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            out/*.bin
            out/release-notes.md
          if-no-files-found: error
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Build manual
        working-directory: docs
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: out
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.bin \
            --title "m5-grayline $GITHUB_REF_NAME" \
            --notes-file out/release-notes.md \
            --verify-tag

  deploy:
    name: Deploy manual to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

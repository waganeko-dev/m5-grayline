; m5-grayline: Grayline Map for M5Stack
; Target: M5Stack Basic V2.6 (ESP32-D0WDQ6-V3, 16MB flash, no PSRAM, CH9102 USB-serial)

[platformio]
default_envs = m5stack-core-16m

[env:m5stack-core-16m]
platform = espressif32
framework = arduino
board = m5stack-core-esp32-16M
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
extra_scripts = pre:tools/version.py
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
    m5stack/M5Unified
    bblanchon/ArduinoJson@^7

; Unit tests of the pure calculation / layout logic, run on the PC:
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Isrc -Wall
